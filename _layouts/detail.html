---
layout: base
---

<article class="detail">
  <div class="page-title">
    <div class="page-title__inner">
      {% if page.venue %}<p class="kicker">{{ page.venue }}</p>{% endif %}
      <h1 class="page-title__h1">{{ page.title }}</h1>
    </div>
  </div>

  <div class="band band--tight">
    <div class="band__inner">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </div>
</article>
